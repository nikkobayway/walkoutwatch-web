name: Pre-render Fight Data

on:
  schedule:
    - cron: '0 * * * *'      # every hour
  push:
    branches: [main]
    paths-ignore:            # don't retrigger on its own commits
      - 'fights.json'
      - 'schema-fights.json'
      - 'fights-static.html'
      - 'fights/**'          # don't retrigger when fight pages update
      - 'sitemap.xml'
      - 'robots.txt'
  workflow_dispatch:          # lets you click "Run workflow" manually

permissions:
  contents: write             # required to push generated files back

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install csv-parse

      - name: Run pre-render
        run: node prerender.js

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fights.json schema-fights.json fights-static.html fights/ sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: pre-render fight data & per-fight pages [skip ci]"
            # Retry push with rebase in case main moved since checkout (e.g. a
            # manual push landed while this run was building). Up to 5 tries
            # with a short backoff before giving up.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push rejected (attempt ドル{i}/5) — pulling and retrying..."
              git pull --rebase origin main
              sleep 3
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi
