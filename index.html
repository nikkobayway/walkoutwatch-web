<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Walkout Watch | Live MMA & Boxing Main Event Countdown Timers</title>
    <meta name="description" content="Never miss a fight walkout. Real-time centered countdown timers for UFC, MMA, and Boxing main events with instant local timezone adjustments.">
    <link rel="canonical" href="https://walkoutwatch.com/">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Share+Tech+Mono&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #07080a;       
            --bg-card: #0e1117;       
            --bg-control: #141923;    
            --accent-volt: #ccff00;   /* Brand Neon Green/Yellow */
            --accent-cyber: #00f0ff;  /* Brand Neon Cyber Blue */
            --accent-time: #ff3c00;   /* Brand Red */
            --text-primary: #ffffff;  
            --text-muted: #5e687a;    
            --laser-border: rgba(255, 60, 0, 0.15); 
            --transition-tech: 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-primary);
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
            position: relative;
            z-index: 1000 !important;
            border-bottom: 1px solid;
            border-image: linear-gradient(to right, transparent, rgba(0, 240, 255, 0.2), transparent) 1;
            padding-bottom: 2.5rem;
            margin-bottom: 3.5rem;
        }

        .app-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .app-title .title-walkout {
            font-family: 'Oswald', sans-serif;
            color: var(--accent-volt);
            text-shadow: 
                0 0 10px rgba(204, 255, 0, 0.5),
                0 0 25px rgba(204, 255, 0, 0.2);
        }

        .app-title .title-watch {
            font-family: 'Oswald', sans-serif;
            color: var(--accent-cyber); 
            text-shadow: 
                0 0 10px rgba(0, 240, 255, 0.6),
                0 0 25px rgba(0, 240, 255, 0.3);
        }

        .sport-selection-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 1010 !important;
        }

        .sport-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px; 
            width: 150px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer !important;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            pointer-events: auto !important;
            transition: all var(--transition-tech);
        }

        /* Boxing Custom Hover State -> Yellow/Volt Glow */
        #btn-boxing:hover {
            border-color: var(--accent-volt);
            color: var(--text-primary);
            background: rgba(204, 255, 0, 0.02);
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.08);
        }

        /* MMA Custom Hover State -> Blue/Cyber Glow */
        #btn-mma:hover {
            border-color: var(--accent-cyber);
            color: var(--text-primary);
            background: rgba(0, 240, 255, 0.02);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.08);
        }

        /* FIXED: Boxing Active State - Locked to Neon Volt Yellow */
        #btn-boxing.active {
            border-color: var(--accent-volt) !important;
            color: var(--accent-volt) !important;
            background: linear-gradient(180deg, rgba(204, 255, 0, 0.03) 0%, transparent 100%), var(--bg-card);
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.15);
        }

        /* FIXED: MMA Active State - Locked to Neon Cyber Blue */
        #btn-mma.active {
            border-color: var(--accent-cyber) !important;
            color: var(--accent-cyber) !important;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.03) 0%, transparent 100%), var(--bg-card);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
        }

        .timezone-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .timezone-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .timezone-switch {
            display: flex;
            background: #090c10;
            padding: 3px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .zone-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: all var(--transition-tech);
        }

        .zone-btn:hover { color: var(--text-primary); }

        .zone-btn.active {
            background: var(--bg-control);
            color: var(--accent-time); 
            border: 1px solid var(--laser-border);
            box-shadow: 0 0 15px rgba(255, 60, 0, 0.15); 
        }

        .schedule-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            z-index: 10 !important;
        }

        .fight-card {
            background: var(--bg-card);
            border-radius: 4px; 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: border-color var(--transition-tech), box-shadow var(--transition-tech);
            
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.12);
        }

        .fight-card.boxing-card {
            border: 1px solid rgba(204, 255, 0, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(204, 255, 0, 0.12);
        }

        .fight-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            z-index: 5;
        }

        .fight-card.mma-card::before { background: var(--accent-cyber); }
        .fight-card.boxing-card::before { background: var(--accent-volt); } 

        .fight-card.mma-card:hover {
            border-color: rgba(0, 240, 255, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 240, 255, 0.22);
        }
        .fight-card.boxing-card:hover {
            border-color: rgba(204, 255, 0, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 35px rgba(204, 255, 0, 0.22);
        }

        .card-main-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 2rem;
            width: 100%;
            cursor: pointer;
            background: transparent;
            user-select: none;
        }
        
        .card-main-trigger:hover {
            background: rgba(255, 255, 255, 0.01);
        }

        .card-left-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .dropdown-carat {
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            transform: rotate(45deg);
            transition: transform var(--transition-tech), border-color var(--transition-tech);
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .fight-card:hover .dropdown-carat {
            border-color: var(--text-primary);
        }

        .fight-card.expanded .dropdown-carat {
            transform: rotate(-135deg) translateY(-2px);
            border-color: var(--accent-volt);
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .org-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .tag-mma { color: var(--accent-cyber); }
        .tag-boxing { color: var(--accent-volt); } 

        .fight-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .fight-title .vs {
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin: 0 0.5rem;
        }

        .fight-meta {
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .fight-loc-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .fight-date-tag {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-cyber);
            background: rgba(0, 240, 255, 0.05);
            padding: 0.1rem 0.5rem;
            border-radius: 2px;
            border: 1px solid rgba(0, 240, 255, 0.1);
        }
        
        .fight-card.boxing-card .fight-date-tag {
            color: var(--accent-volt); 
            background: rgba(204, 255, 0, 0.05);
            border-color: rgba(204, 255, 0, 0.1);
        }

        .card-timers {
            background: #090c10;
            border-radius: 2px;
            padding: 1.25rem;
            min-width: 360px; 
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            pointer-events: none; 
        }

        .timer-header-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.4rem;
        }

        .timer-row {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .clock-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pulse-dot {
            font-weight: 900;
            animation: tech-blink 1.5s infinite steps(1);
            color: var(--accent-time); 
        }

        @keyframes tech-blink { 50% { opacity: 0.3; } }

        .clock-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .clock-display.cyber-blue-timer {
            color: var(--accent-cyber);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .time-unit {
            font-size: 1rem;
            color: var(--text-muted);
            margin-right: 0.4rem;
            margin-left: 0.1rem;
        }

        .undercard-drawer {
            display: none; 
            background: #090c11;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .fight-card.expanded .undercard-drawer {
            display: block;
        }

        .undercard-content {
            padding: 1.5rem 2rem 2rem 3.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .undercard-section-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-cyber);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .fight-card.boxing-card .undercard-section-title {
            color: var(--accent-volt); 
        }

        .undercard-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            list-style: none;
        }

        .undercard-row {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .undercard-fighters {
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        .undercard-fighters .uc-vs {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin: 0 0.4rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .undercard-weight {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.02);
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
        }

        .icon-octagon {
            width: 28px;
            height: 28px;
            background: currentColor;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        .icon-glove {
            width: 22px;
            height: 26px;
            border: 2px solid currentColor;
            border-radius: 4px 4px 2px 2px;
        }

        @media (max-width: 850px) {
            .card-main-trigger { flex-direction: column; align-items: stretch; gap: 1.5rem; }
            .card-left-group { align-items: flex-start; }
            .card-timers { min-width: 100%; }
            .undercard-list { grid-template-columns: 1fr; }
            .undercard-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">
            <span class="title-walkout">WALKOUT</span> <span class="title-watch">WATCH</span>
        </h1>
        <div class="sport-selection-container">
            <button id="btn-boxing" class="sport-card">
                <div class="icon-glove"></div>
                <span>BOXING</span>
            </button>
            <button id="btn-mma" class="sport-card active">
                <div class="icon-octagon"></div>
                <span>MMA</span>
            </button>
        </div>
        
        <div class="timezone-container">
            <span class="timezone-label">TIMEZONE TELEMETRY</span>
            <div class="timezone-switch">
                <button id="zone-pdt" class="zone-btn active" data-offset="-7">PDT (West)</button>
                <button id="zone-mdt" class="zone-btn" data-offset="-6">MDT (Mountain)</button>
                <button id="zone-cdt" class="zone-btn" data-offset="-5">CDT (Central)</button>
                <button id="zone-est" class="zone-btn" data-offset="-4">EDT (East)</button>
                <button id="zone-bst" class="zone-btn" data-offset="+1">BST (UK)</button>
            </div>
        </div>
    </header>

    <main id="schedule-container" class="schedule-container">
        <div style="text-align: center; color: var(--text-muted); font-family: 'Share Tech Mono', monospace; padding: 40px 0;">LOAD OUT LOCAL DB MATRICES...</div>
    </main>

    <script>
        let currentSport = 'MMA';
        let currentOffset = -7; 
        let localDbData = [];

        function setupDrawers() {
            document.querySelectorAll('.card-main-trigger').forEach(trigger => {
                trigger.onclick = (e) => {
                    const card = trigger.closest('.fight-card');
                    if (card) card.classList.toggle('expanded');
                };
            });
        }

        function applyFilters() {
            document.querySelectorAll('.fight-card').forEach(card => {
                const isMMA = card.classList.contains('mma-card');
                if ((currentSport === 'MMA' && isMMA) || (currentSport === 'BOXING' && !isMMA)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        async function loadLocalSchedule() {
            try {
                const response = await fetch('fights.json');
                localDbData = await response.json();
                
                const container = document.getElementById('schedule-container');

                container.innerHTML = localDbData.map((event, index) => {
                    const isMMA = event.sport === 'MMA';
                    const cardTypeClass = isMMA ? 'mma-card' : 'boxing-card';
                    const tagTypeClass = isMMA ? 'tag-mma' : 'tag-boxing';
                    
                    let titleHTML = event.main_event;
                    if (titleHTML.toLowerCase().includes(' vs ')) {
                        const parts = titleHTML.split(/ vs /i);
                        titleHTML = `${parts[0]} <span class="vs">VS</span> ${parts[1]}`;
                    }

                    const targetDate = new Date(event.datetime);
                    let formattedDateStr = "Date TBD";
                    if(!isNaN(targetDate.getTime())) {
                        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        formattedDateStr = `${days[targetDate.getDay()]}, ${months[targetDate.getMonth()]} ${targetDate.getDate()}`;
                    }

                    const boutsHTML = event.fight_card.map(bout => `
                        <li class="undercard-row">
                            <span class="undercard-fighters">${bout.fighter_a} <span class="uc-vs">VS</span> ${bout.fighter_b}</span>
                            <span class="undercard-weight">${bout.weight_class.toUpperCase()}</span>
                        </li>
                    `).join('');

                    const mainTimerColorClass = isMMA ? 'cyber-blue-timer' : 'volt';

                    return `
                        <div class="fight-card ${cardTypeClass}" id="card-${index}">
                            <div class="card-main-trigger">
                                <div class="card-left-group">
                                    <div class="dropdown-carat"></div>
                                    <div class="card-details">
                                        <div class="org-tag ${tagTypeClass}">${event.organization}</div>
                                        <h2 class="fight-title">${titleHTML}</h2>
                                        <p class="fight-meta" id="meta-${index}">Telemetry Sync Pending</p>
                                        <div class="fight-loc-row">
                                            <span class="fight-date-tag">🗓️ ${formattedDateStr}</span>
                                            <span>📍 ${event.city}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-timers">
                                    <div class="timer-header-label">LIVE TELEMETRY CLOCKS</div>
                                    <div class="timer-row">
                                        <span class="clock-label">PRELIM START <span class="pulse-dot">•</span></span>
                                        <span class="clock-display" id="prelim-timer-${index}">00d 00h 00m 00s</span>
                                    </div>
                                    <div class="timer-row">
                                        <span class="clock-label">MAIN EVENT WALKOUT <span class="pulse-dot">•</span></span>
                                        <span class="clock-display ${mainTimerColorClass}" id="main-timer-${index}">00d 00h 00m 00s</span>
                                    </div>
                                </div>
                            </div>
                            <div class="undercard-drawer">
                                <div class="undercard-content">
                                    <div class="undercard-section-title">Telemetry Bout Roster</div>
                                    <ul class="undercard-list">
                                        ${boutsHTML}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                setupDrawers();
                applyFilters();
                startClocks();

            } catch (error) {
                console.error('Local File Read Failure:', error);
                document.getElementById('schedule-container').innerHTML = "<div style='text-align:center;color:var(--accent-volt);font-family: \"Share Tech Mono\", monospace;'>JSON SYNC ERROR. VERIFY PATH INTEGRITY.</div>";
            }
        }

        function startClocks() {
            setInterval(() => {
                const now = new Date();

                localDbData.forEach((event, index) => {
                    const mainTimer = document.getElementById(`main-timer-${index}`);
                    const prelimTimer = document.getElementById(`prelim-timer-${index}`);
                    const metaText = document.getElementById(`meta-${index}`);
                    
                    const targetDate = new Date(event.datetime);
                    if (isNaN(targetDate.getTime())) return;

                    if (metaText) {
                        const adjustedDate = new Date(targetDate.getTime() + (currentOffset + 7) * 60 * 60 * 1000);
                        let hoursNum = adjustedDate.getHours();
                        const ampm = hoursNum >= 12 ? 'PM' : 'AM';
                        hoursNum = hoursNum % 12;
                        hoursNum = hoursNum ? hoursNum : 12;
                        const minsStr = String(adjustedDate.getMinutes()).padStart(2, '0');
                        metaText.innerHTML = `Main Card Start: approx ${hoursNum}:${minsStr} ${ampm} Local Sync`;
                    }

                    if (mainTimer) {
                        const mainDiff = targetDate - now;
                        if (mainDiff <= 0) {
                            mainTimer.innerHTML = "LIVE NOW";
                            mainTimer.style.color = "var(--accent-cyber)";
                        } else {
                            mainTimer.innerHTML = formatTime(mainDiff);
                        }
                    }

                    if (prelimTimer) {
                        const prelimDiff = (targetDate.getTime() - (3 * 60 * 60 * 1000)) - now.getTime();
                        if (prelimDiff <= 0) {
                            prelimTimer.innerHTML = "LIVE NOW";
                            prelimTimer.style.color = "var(--accent-cyber)";
                        } else {
                            prelimTimer.innerHTML = formatTime(prelimDiff);
                            prelimTimer.style.color = "var(--text-primary)";
                        }
                    }
                });
            }, 1000);
        }

        function formatTime(ms) {
            const days = String(Math.floor(ms / (1000 * 60 * 60 * 24))).padStart(2, '0');
            const hours = String(Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((ms % (1000 * 60)) / 1000)).padStart(2, '0');
            return `${days}<span class="time-unit">d</span> ${hours}<span class="time-unit">h</span> ${minutes}<span class="time-unit">m</span> ${seconds}<span class="time-unit">s</span>`;
        }

        document.getElementById('btn-mma').onclick = () => {
            document.getElementById('btn-mma').classList.add('active');
            document.getElementById('btn-boxing').classList.remove('active');
            currentSport = 'MMA';
            applyFilters();
        };

        document.getElementById('btn-boxing').onclick = () => {
            document.getElementById('btn-boxing').classList.add('active');
            document.getElementById('btn-mma').classList.remove('active');
            currentSport = 'BOXING';
            applyFilters();
        };

        document.querySelectorAll('.zone-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentOffset = parseInt(btn.getAttribute('data-offset'));
            };
        });

        loadLocalSchedule();
    </script>
</body>
</html>
