name: Pre-render Fight Data

on:
  schedule:
    # Run every hour at :00
    - cron: '0 * * * *'
  # Also run when you manually push to main
  push:
    branches:
      - main

jobs:
  prerender:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install csv-parse

      - name: Run pre-render script
        run: node prerender.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: pre-render fight data" && git push)
